{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4">
            <h4 class="text-center mb-4"><i class="fas fa-sign-in-alt me-2 text-primary"></i>Login</h4>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
            </form>
            <p class="text-center mt-3 text-muted">Don't have an account? <a href="/register/">Register</a></p>
        </div>
    </div>
</div>
{% endblock %}
