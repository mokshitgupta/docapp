{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="mb-1"><i class="fas fa-calendar-plus me-2 text-primary"></i>Book Appointment</h4>
            <p class="text-muted mb-4">with Dr. {{ doctor.name }} — {{ doctor.get_specialization_display }}</p>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-2">
                    <i class="fas fa-check me-2"></i>Confirm Appointment
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
